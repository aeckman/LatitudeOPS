<div class="dialog-overlay">

<div
  class="dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="password-dialog-title">

  @if (!invalid) {

    <div
      class="title"
      id="password-dialog-title">
      LatitudeOPS
    </div>

    <div class="content">

      <p>
        Enter Password To Access Application
      </p>

      <input 
        type="password"
        [(ngModel)]="password">

    </div>

    <div class="buttons">

      <button (click)="close()">
        Cancel
      </button>

      <button (click)="submit()">
        Submit
      </button>

    </div>

  }


  @if (invalid) {

    <div class="error">

      <div class="stop">
        🛑
      </div>

      <h2>
        INVALID PASSWORD
      </h2>

      <button (click)="close()">
        Cancel
      </button>

    </div>

  }

</div>

</div>
