<div class="taskbar">

  <button 
    class="start-button" 
    [attr.aria-expanded]="startMenuOpen()"
    (click)="startMenuToggleRequested.emit()">

    <img
      class="start-icon"
      src="/assets/icons/applications.png"
      alt="Start">

    <span>
      Start
    </span>

  </button>


  <div class="task-area">

    @for (window of windows(); track window.id) {

      <button
        type="button"
        class="task-button"
        [class.active]="activeWindowId() === window.id && window.mode !== 'minimized'"
        [class.minimized]="window.mode === 'minimized'"
        [attr.aria-pressed]="activeWindowId() === window.id && window.mode !== 'minimized'"
        (click)="windowButtonClicked.emit(window.id)">

        <img [src]="window.icon" alt="">
        <span>{{ window.title }}</span>

      </button>

    }

  </div>


  <app-clock></app-clock>


</div>
